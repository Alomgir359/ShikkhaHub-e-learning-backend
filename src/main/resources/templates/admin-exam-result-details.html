<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Results - ' + ${exam.examName}"></title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f7f0; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; background: #0a3d2f; color: white; padding: 8px 20px; border-radius: 40px; text-decoration: none; margin-bottom: 24px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e2efe5;
        }
        .stat-card h3 { font-size: 32px; font-weight: 800; color: #0a3d2f; }
        .stat-card p { color: #6f8f82; margin-top: 8px; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e2efe5;
            overflow-x: auto;
        }
        .card-title { font-size: 18px; font-weight: 700; color: #0a3d2f; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eaf5ea; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eef3ea; }
        th { background: #f8faf8; font-weight: 700; color: #0a3d2f; }
        .status-pass { background: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; display: inline-block; }
        .status-fail { background: #fee2e2; color: #dc2626; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; display: inline-block; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2,1fr); } table { display: block; overflow-x: auto; } }
    </style>
</head>
<body>
<div class="container">
    <a href="/admin/exam/results" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Results</a>

    <div class="stats-grid">
        <div class="stat-card"><h3 th:text="${results.totalParticipants}">0</h3><p>Total Participants</p></div>
        <div class="stat-card"><h3 th:text="${results.averageMarks}">0</h3><p>Average Marks</p></div>
        <div class="stat-card"><h3 th:text="${exam.totalMarks}">0</h3><p>Total Marks</p></div>
        <div class="stat-card"><h3 th:text="${exam.passingMarks}">0</h3><p>Passing Marks</p></div>
    </div>

    <div class="card">
        <div class="card-title"><i class="fas fa-users"></i> Participant Results - <span th:text="${exam.examName}"></span></div>
        <table>
            <thead>
            <tr><th>Employee ID</th><th>Name</th><th>Rank</th><th>Obtained Marks</th><th>Percentage</th><th>Tab Switches</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${results.participants}">
                <td th:text="${p.employeeId}">EMP001</td>
                <td th:text="${p.employeeName}">John Doe</td>
                <td th:text="${p.rank}">TAO</td>
                <td><strong th:text="${p.obtainedMarks} + ' / ' + ${exam.totalMarks}"></strong></td>
                <td th:text="${p.percentage} + '%'"></td>
                <td th:text="${p.tabSwitches}">0</td>
                <td><span th:class="${p.status == 'PASSED'} ? 'status-pass' : 'status-fail'" th:text="${p.status}">PASSED</span></td>
            </tr>
            <tr th:if="${results.participants.isEmpty()}"><td colspan="7" style="text-align:center; padding:40px;">No participants yet</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
