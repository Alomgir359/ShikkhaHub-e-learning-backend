<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exam Results & Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f7f0; }
        .dashboard { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: #0a3d2f; color: white; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar-header { padding: 32px 24px; border-bottom: 1px solid rgba(255,255,255,0.12); background: linear-gradient(135deg, #0a3d2f, #0f5a45); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { font-size: 32px; color: #7ed957; }
        .logo-text h3 { font-size: 18px; font-weight: 700; }
        .logo-text p { font-size: 11px; opacity: 0.7; }
        .nav-menu { padding: 24px 20px; display: flex; flex-direction: column; gap: 6px; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 14px; font-weight: 500; font-size: 14px; cursor: pointer; text-decoration: none; color: #e2f0e9; }
        .nav-item i { width: 24px; }
        .nav-item:hover, .nav-item.active { background: #2b8c5e; color: white; }
        .nav-divider { height: 1px; background: rgba(255,255,255,0.15); margin: 12px 4px; }
        .nav-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255,255,255,0.45); padding: 8px 18px 4px; }
        .sidebar-footer { padding: 24px 20px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12px; opacity: 0.7; }
        .main-content { flex: 1; margin-left: 280px; padding: 24px 32px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .page-title h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #0a3d2f, #1a6e48); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .card { background: white; border-radius: 20px; padding: 24px; margin-bottom: 24px; border: 1px solid #e2efe5; }
        .card-title { font-size: 18px; font-weight: 700; color: #0a3d2f; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eaf5ea; }
        .exam-list { display: flex; flex-direction: column; gap: 12px; }
        .exam-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: #fafef7; border-radius: 16px; border: 1px solid #eef3ea; flex-wrap: wrap; gap: 12px; }
        .btn { padding: 8px 24px; border-radius: 40px; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: #2b8c5e; color: white; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-content { margin-left: 0; } }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="sidebar">
        <div class="sidebar-header"><div class="logo-area"><i class="fas fa-chalkboard-user logo-icon"></i><div class="logo-text"><h3>Employee Learning System</h3><p>Admin Portal</p></div></div></div>
        <div class="nav-menu">
            <div class="nav-section-title">MAIN</div>
            <a href="/admin/teachers" class="nav-item"><i class="fas fa-users"></i> <span>Teachers</span></a>
            <div class="nav-divider"></div>
            <div class="nav-section-title">EXAM MANAGEMENT</div>
            <a href="/admin/exam/dashboard" class="nav-item"><i class="fas fa-tachometer-alt"></i> <span>Exam Dashboard</span></a>
            <a href="/admin/exam/ranks" class="nav-item"><i class="fas fa-chart-line"></i> <span>Manage Ranks</span></a>
            <a href="/admin/exam/employees" class="nav-item"><i class="fas fa-users"></i> <span>Manage Employees</span></a>
            <a href="/admin/exam/settings" class="nav-item"><i class="fas fa-cog"></i> <span>Exam Settings</span></a>
            <a href="/admin/exam/results" class="nav-item active"><i class="fas fa-chart-bar"></i> <span>Results & Analytics</span></a>
            <div class="nav-divider"></div>
            <a href="/admin/logout" class="nav-item"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
        </div>
        <div class="sidebar-footer"><i class="fas fa-shield-alt"></i> Admin Access</div>
    </div>

    <div class="main-content">
        <div class="top-bar"><div class="page-title"><h1>Exam Results & Analytics</h1></div></div>

        <div class="card">
            <div class="card-title"><i class="fas fa-chart-line"></i> Exam Results Summary</div>
            <div class="exam-list">
                <div th:each="exam : ${exams}" class="exam-item">
                    <div>
                        <strong th:text="${exam.examName}">Exam Name</strong>
                        <div style="font-size: 12px; color: #6f8f82;"><span th:text="${exam.totalQuestions}"></span> questions | <span th:text="${exam.totalMarks}"></span> marks</div>
                    </div>
                    <a th:href="@{/admin/exam/results/{id}(id=${exam.id})}" class="btn btn-primary"><i class="fas fa-chart-bar"></i> View Results</a>
                </div>
                <div th:if="${exams.isEmpty()}" style="text-align: center; padding: 40px;">No exams available</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
