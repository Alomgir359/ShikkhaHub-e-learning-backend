# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lms_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.web.resources.static-locations=classpath:/static/,file:uploads/

# File Upload Configuration
# 1GB so instructors can upload recorded class videos (the landing page video still has its own 200MB check)
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1100MB
server.tomcat.max-swallow-size=-1
file.upload.directory=uploads/teachers
file.site.directory=uploads/site
# Recorded videos, thumbnails, assignment files and student submissions.
# Kept OUTSIDE "uploads/" because that folder is served publicly (see static-locations above).
file.classroom.directory=classroom-data
# Logging (optional - for debugging)
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG

# Session timeout (in seconds) - 8 hours
server.servlet.session.timeout=28800